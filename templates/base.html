<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}RepoPredict{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:#f5f7fb;color:#182230}.navbar{background:#102a43}.brand{color:#fff;font-weight:700}.card{border:0;box-shadow:0 8px 25px #102a4310;border-radius:16px}.badge-risk{font-size:.9rem}.score{font-size:1.6rem;font-weight:700}.muted{color:#64748b}.diff{max-height:24rem;overflow:auto;background:#f1f3f5;padding:1rem;white-space:pre-wrap;word-break:break-word}</style>
</head><body><nav class="navbar navbar-dark mb-5"><div class="container"><a class="navbar-brand brand" href="/">RepoPredict</a>
{% if username %}<div class="d-flex align-items-center gap-3 text-white"><span>{{ username }}</span><form action="{{ url_for('logout') }}" method="post"><button class="btn btn-outline-light btn-sm">Sign out</button></form></div>{% endif %}</div></nav>
<main class="container pb-5">{% block content %}{% endblock %}</main></body></html>
